<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Institutos - Relevamiento Docente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #mapa { height: 70vh; width: 100%; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
    <header class="bg-indigo-900 text-white p-4 shadow">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row md:justify-between md:items-center gap-3">
            <h1 class="text-lg font-bold">🗺️ Mapa de Institutos de Educación Superior - Salta</h1>
            <a href="/" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs font-semibold whitespace-nowrap">← Volver al formulario</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto my-6 p-4 md:p-6">
        <div class="bg-white rounded-xl shadow border p-4 md:p-6">
            <p class="text-sm text-slate-600 mb-4">
                Ubicación de los institutos registrados en el sistema. Hacé clic en un marcador para ver los datos de contacto.
            </p>
            <div id="mapa"></div>
            {% if not institutos %}
            <p class="text-slate-400 italic text-sm mt-4">Todavía no hay institutos con ubicación cargada.</p>
            {% endif %}
        </div>
    </main>

    <script>
        const institutos = {{ institutos | tojson }};

        const mapa = L.map('mapa').setView([-24.78, -64.6], 7); // vista centrada en Salta

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(mapa);

        const bounds = [];

        institutos.forEach(inst => {
            if (inst.latitud && inst.longitud) {
                const marker = L.marker([inst.latitud, inst.longitud]).addTo(mapa);
                marker.bindPopup(`
                    <strong>${inst.nombre}</strong><br>
                    📍 ${inst.localidad || ''}<br>
                    ${inst.direccion ? inst.direccion + '<br>' : ''}
                    ${inst.email ? '✉️ ' + inst.email + '<br>' : ''}
                    ${inst.telefono ? '📞 ' + inst.telefono : ''}
                `);
                bounds.push([inst.latitud, inst.longitud]);
            }
        });

        if (bounds.length > 0) {
            mapa.fitBounds(bounds, { padding: [30, 30] });
        }
    </script>
</body>
</html>
